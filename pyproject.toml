[project]
name = "ta-model-v2"
version = "0.1.0"
description = "Validation-first trading intelligence contracts and implementation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.10.6",
]

[dependency-groups]
dev = [
  "mypy==1.15.0",
  "pytest==9.0.3",
  "ruff==0.9.10",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ta_model"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "contract: contract-level tests for cross-component schemas",
  "schema: Pydantic schema validation tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
