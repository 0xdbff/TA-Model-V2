services:
  mlflow-postgres:
    image: postgres:16.4
    profiles: ["core", "research"]
    environment:
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER:-mlflow_local_user}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-mlflow_local_password_change_me}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["core", "research"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MLFLOW_MINIO_ROOT_USER:-mlflow_local_access_key}
      MINIO_ROOT_PASSWORD: ${MLFLOW_MINIO_ROOT_PASSWORD:-mlflow_local_secret_key_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mlflow_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: ta-model-v2-mlflow:s7-003
    profiles: ["core", "research"]
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      mlflow-minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MLFLOW_MINIO_ROOT_USER:-mlflow_local_access_key}
      AWS_SECRET_ACCESS_KEY: ${MLFLOW_MINIO_ROOT_PASSWORD:-mlflow_local_secret_key_change_me}
      MLFLOW_S3_ENDPOINT_URL: http://mlflow-minio:9000
    ports:
      - "5000:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://${MLFLOW_POSTGRES_USER:-mlflow_local_user}:${MLFLOW_POSTGRES_PASSWORD:-mlflow_local_password_change_me}@mlflow-postgres:5432/${MLFLOW_POSTGRES_DB:-mlflow}
      - --default-artifact-root
      - s3://ta-model-v2-mlflow-artifacts/local

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    profiles: ["stream"]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda_stream_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=redpanda:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  stream-smoke:
    build:
      context: .
      dockerfile: docker/stream-smoke/Dockerfile
    image: ta-model-v2-stream-smoke:s3-004
    profiles: ["stream"]
    entrypoint: ["/bin/sh", "-ec"]
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./tests/fixtures/stream/stream_profile_events.jsonl:/fixtures/stream_profile_events.jsonl:ro
    command:
      - |
        rpk topic create stream.fixture.events --brokers=redpanda:9092 || true
        rpk topic produce stream.fixture.events --brokers=redpanda:9092 < /fixtures/stream_profile_events.jsonl
        rpk topic consume stream.fixture.events --brokers=redpanda:9092 --offset=start --num=4 --format='%v\n' > /tmp/consumed.jsonl
        test "$(wc -l < /tmp/consumed.jsonl | tr -d ' ')" = "4"
        python scripts/stream_profile_fixture_smoke.py --input /tmp/consumed.jsonl --output /tmp/stream-smoke.json
        printf 'stream profile smoke passed: produced, consumed, and contract-validated 4 fixture-only events\n'

volumes:
  mlflow_minio_data:
  mlflow_postgres_data:
  redpanda_stream_data:
